<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HardenLab · Repaso Hardening de Windows</title>
<style>
:root{--bg:#060b14;--card:#0d1626;--line:#1b2c47;--c:#22d3ee;--ok:#34d399;--bad:#f87171;--t:#e6edf7;--m:#8aa0bf}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--t);font-family:ui-monospace,SFMono-Regular,Consolas,Menlo,monospace;
background-image:linear-gradient(rgba(34,211,238,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(34,211,238,.05) 1px,transparent 1px);background-size:40px 40px}
.w{max-width:760px;margin:0 auto;padding:24px 16px}
h1{font-size:1.6rem;margin:0;letter-spacing:.5px}h1 span{color:var(--c);text-shadow:0 0 12px var(--c)}
.sub{color:var(--m);font-size:.85rem;margin:6px 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:0 0 30px rgba(34,211,238,.06)}
label{display:block;color:var(--m);font-size:.8rem;margin:16px 0 8px;text-transform:uppercase;letter-spacing:1px}
.row{display:flex;gap:8px;flex-wrap:wrap}
button,select{font:inherit;color:var(--t);background:#0a1222;border:1px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer;transition:.15s}
button:hover:not(:disabled),select:hover{border-color:var(--c);box-shadow:0 0 12px rgba(34,211,238,.25)}
.chip.on{border-color:var(--c);color:var(--c);background:rgba(34,211,238,.1)}
.go{background:var(--c);color:#04222b;font-weight:700;border:0;width:100%;margin-top:22px;padding:14px}
.top{display:flex;justify-content:space-between;color:var(--m);font-size:.8rem;margin-bottom:8px}
.bar{height:6px;background:var(--line);border-radius:9px;overflow:hidden;margin-bottom:18px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--c),#818cf8);transition:.3s}
.tag{display:inline-block;font-size:.7rem;color:var(--c);border:1px solid var(--c);border-radius:99px;padding:2px 10px;margin-bottom:10px}
.q{font-size:1.1rem;line-height:1.5;margin:0 0 16px}
.opt{display:block;width:100%;text-align:left;margin-bottom:10px;line-height:1.4}
.opt b{color:var(--c);margin-right:8px}
.opt.ok{border-color:var(--ok);background:rgba(52,211,153,.12)}
.opt.no{border-color:var(--bad);background:rgba(248,113,113,.12)}
.nx{margin-top:8px;float:right;background:var(--c);color:#04222b;border:0;font-weight:700}
.ring{width:150px;height:150px;border-radius:50%;margin:10px auto;display:grid;place-items:center}
.ring div{width:118px;height:118px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:2rem;font-weight:700}
.stats{display:flex;gap:10px;justify-content:center;margin:14px 0}
.stats div{flex:1;text-align:center;border:1px solid var(--line);border-radius:10px;padding:10px}
.stats b{display:block;font-size:1.4rem}
.tp{margin:10px 0;font-size:.85rem}.tp .bar{margin:4px 0 0}
.fail{border-left:3px solid var(--bad);padding:8px 12px;margin:10px 0;background:#0a1222;border-radius:0 8px 8px 0;font-size:.88rem}
.fail em{color:var(--ok);font-style:normal}.fail s{color:var(--bad)}
h3{color:var(--c);margin:22px 0 6px;font-size:.95rem}
.hide{display:none}
.ex{margin:14px 0 4px;padding:12px 14px;border-radius:10px;font-size:.9rem;line-height:1.5;border:1px solid}
.ex.y{border-color:var(--ok);background:rgba(52,211,153,.08)}.ex.n{border-color:var(--bad);background:rgba(248,113,113,.08)}
.ex b{display:block;margin-bottom:4px}.ex.y b{color:var(--ok)}.ex.n b{color:var(--bad)}
</style>
</head>
<body>
<div class="w">
<h1>&gt; Harden<span>Lab</span>_</h1>
<p class="sub">Repaso de Hardening de Windows · 53 preguntas · selección múltiple</p>
<div id="app" class="card"></div>
</div>
<script>
const TOPICS={G:"GPO y gpedit",C:"Cuentas y acceso",S:"Servicios y protocolos",R:"Registro",U:"Actualizaciones",F:"Firewall, Defender y apps",A:"Auditoría",H:"Conceptos de hardening"};
// Formato: "Tema|Pregunta|Correcta|Incorrecta|Incorrecta|Incorrecta" (las opciones se mezclan al jugar)
const RAW=[
"G|¿Qué comando abre el Editor de directivas de grupo local?|gpedit.msc|secpol.msc|eventvwr.msc|regedit",
"G|¿En qué ediciones de Windows viene gpedit.msc por defecto?|Pro, Enterprise y Education|Todas, incluida Home|Solo en Home|Solo en Windows Server",
"G|¿Qué comando fuerza la aplicación inmediata de las directivas de grupo?|gpupdate /force|gpresult /r|net accounts|auditpol /get",
"G|¿Para qué sirve gpresult /h C:\\ruta\\reporte.html?|Exportar un reporte HTML de las directivas aplicadas|Forzar las directivas|Desbloquear cuentas|Listar servicios",
"G|La Configuración del equipo en gpedit se corresponde con la rama del registro:|HKEY_LOCAL_MACHINE|HKEY_CURRENT_USER|HKEY_CLASSES_ROOT|HKEY_CURRENT_CONFIG",
"G|La Configuración de usuario en gpedit se corresponde con la rama:|HKEY_CURRENT_USER|HKEY_LOCAL_MACHINE|HKEY_USERS_ALL|HKEY_SERVICES",
"G|¿Dónde se configura la longitud mínima de la contraseña?|Directivas de cuenta > Directiva de contraseñas|Directivas locales > Opciones de seguridad|Asignación de derechos de usuario|Plantillas administrativas > Sistema",
"G|\"Inicio de sesión interactivo: No mostrar el último nombre de usuario\" está en:|Opciones de seguridad|Asignación de derechos de usuario|Directiva de bloqueo de cuenta|Directiva de contraseñas",
"G|¿Qué permite la Asignación de derechos de usuario?|Controlar quién inicia sesión local, actúa como parte del SO o depura|Definir la complejidad de contraseñas|Deshabilitar AutoRun de USB|Configurar el umbral de bloqueo",
"G|¿Qué se configura con Plantillas administrativas?|Ej.: deshabilitar AutoRun/AutoPlay de unidades USB|El historial de contraseñas|El umbral de bloqueo|Los derechos de apagado",
"G|Una GPO de dominio (Active Directory) se diferencia de una política local en que:|Se aplica de forma centralizada a muchos equipos|Solo afecta a un equipo|No puede configurar seguridad|Solo funciona en Home",
"C|Un umbral de bloqueo de cuenta en 0 significa que:|La cuenta nunca se bloquea por intentos fallidos|Se bloquea al primer intento|Se bloquea para siempre|Se bloquea a los 10 intentos",
"C|¿Qué valor de umbral de bloqueo recomienda la buena práctica?|5 intentos|0 intentos|999 intentos|50 intentos",
"C|Una duración de bloqueo de 0 significa:|Bloqueo permanente hasta que un administrador desbloquee|No hay bloqueo|Bloqueo de 1 minuto|Bloqueo de 99,999 minutos",
"C|¿Cuál es la finalidad principal del bloqueo de cuentas?|Mitigar ataques de fuerza bruta|Cifrar el disco|Actualizar el sistema|Auditar archivos",
"C|¿Qué cmdlet desbloquea una cuenta de Active Directory?|Unlock-ADAccount|Get-ADUser|Set-Service|Get-LocalUser",
"C|¿Qué Event ID registra el bloqueo de una cuenta?|4740|4624|4672|5379",
"C|¿Qué comando muestra las políticas de contraseña del sistema local?|net accounts|gpresult /h|Get-Service|auditpol /get",
"C|La presentación recomienda una longitud mínima de contraseña de:|12 caracteres|4 caracteres|6 caracteres|3 caracteres",
"C|El historial de contraseñas sirve para:|Evitar que se reutilicen contraseñas anteriores|Forzar el cambio diario|Bloquear la cuenta|Cifrar contraseñas",
"C|¿Qué valor se recomienda para la edad mínima de la contraseña?|1 día|60 días|90 días|365 días",
"C|El principio de mínimo privilegio establece que:|Cada usuario o proceso tenga solo los permisos estrictamente necesarios|Todos sean administradores|Se usen permisos máximos|Se comparta una cuenta admin",
"C|Usar cuentas estándar en el día a día:|Reduce el impacto de un ataque|Aumenta la superficie de ataque|Permite instalar software libremente|Desactiva UAC",
"C|¿Qué hace UAC (Control de cuentas de usuario)?|Pide confirmación antes de permitir cambios importantes|Cifra los archivos|Escanea malware|Bloquea puertos",
"C|En las directivas de denegación de derechos, ¿qué prevalece?|Denegar sobre permitir|Permitir sobre denegar|La más reciente siempre|Ninguna, se anulan",
"S|¿Qué servicio se recomienda deshabilitar si no se requiere administración remota del registro?|Remote Registry|Windows Update|Windows Event Log|DHCP Client",
"S|¿Qué tipo de inicio impide que un servicio se ejecute incluso manualmente?|Deshabilitado|Manual|Automático|Automático (retrasado)",
"S|¿Qué protocolo antiguo se recomienda deshabilitar cuando no es necesario?|SMBv1|HTTPS|SMBv3|TLS 1.3",
"S|¿Por qué Telnet es un protocolo inseguro?|No protege la información mediante cifrado|Usa cifrado fuerte|Es muy nuevo|Bloquea el firewall",
"S|¿Qué comando consulta el estado de SMBv1?|Get-WindowsOptionalFeature -Online -FeatureName SMB1Protocol|Get-NetFirewallProfile|Get-LocalUser|gpresult /r",
"S|Deshabilitar servicios innecesarios:|Reduce la superficie de ataque|Aumenta la superficie de ataque|Instala parches|Elimina el firewall",
"S|Antes de deshabilitar un servicio se debe:|Verificar sus dependencias y para qué sirve|Borrarlo del sistema|Reiniciar el equipo|Desactivar Defender",
"S|La superficie de ataque incluye:|Servicios, puertos, protocolos y cuentas|Solo los puertos|Solo el antivirus|Solo las contraseñas",
"R|¿Con qué herramienta se accede al Registro de Windows?|regedit|gpedit.msc|eventvwr.msc|secpol.msc",
"R|¿Qué rama almacena la configuración del usuario que inició sesión?|HKEY_CURRENT_USER|HKEY_LOCAL_MACHINE|HKEY_CLASSES_ROOT|HKEY_USERS_ALL",
"R|Antes de modificar el registro lo recomendable es:|Crear un punto de restauración o exportar las claves|Borrar claves dudosas|Modificar sin documentar|Desactivar Defender",
"R|Siempre que sea posible, las restricciones se aplican mediante:|Políticas de Grupo (GPO) en lugar de editar el registro a mano|Edición manual del registro|Scripts no firmados|Desactivar servicios",
"U|¿Para qué sirve WSUS?|Administrar de forma centralizada la aprobación y distribución de actualizaciones|Bloquear tráfico entrante|Escanear malware en tiempo real|Gestionar contraseñas",
"U|¿Qué herramientas gestionan parches de forma controlada en servidores?|WSUS, MECM y Azure Update Manager|AppLocker y SRP|Defender y Firewall|Autoruns y regedit",
"U|Deshabilitar por completo Windows Update como práctica de hardening es:|Incorrecto: se deben mantener los parches de seguridad|Recomendado|Obligatorio|Válido solo en servidores",
"U|¿Por qué validar parches en un entorno de pruebas?|Para evitar problemas antes de pasarlos a producción|Para acelerar la instalación|Porque no son necesarios|Para ahorrar licencias",
"U|Un servidor desactualizado expone a riesgos como:|Ransomware, ejecución remota de código y movimiento lateral|Solo lentitud|Ningún riesgo|Solo fallos visuales",
"F|Por defecto, el Firewall de Windows con tráfico entrante sin regla de permitir:|Lo bloquea|Lo permite|Lo permite solo en red pública|Solo lo registra",
"F|¿Qué perfil de firewall se aplica en una Wi-Fi pública?|Público|Dominio|Privado|Ninguno",
"F|¿Qué enfoque de firewall se recomienda?|Denegar por defecto y permitir solo lo necesario|Permitir todo y bloquear lo malicioso|Deshabilitar el firewall|Permitir solo tráfico saliente",
"F|\"Acceso controlado a carpetas\" de Defender ayuda a proteger contra:|Ransomware|Ataques DDoS|SMBv1|Fallos de disco",
"F|¿Qué herramienta ofrece baselines de seguridad con Policy Analyzer y LGPO?|Microsoft Security Compliance Toolkit|Windows Admin Center|Sysinternals Autoruns|WSUS",
"F|AppLocker permite:|Crear reglas por editor, ruta o hash para permitir o bloquear ejecutables|Distribuir parches|Cifrar el registro|Auditar inicios de sesión",
"F|¿Qué comando verifica el estado del Firewall de Windows?|Get-NetFirewallProfile|Get-LocalUser|Get-Service|net accounts",
"A|Los eventos de auditoría de seguridad se revisan en el registro:|Seguridad|Aplicación|Instalación|Sistema",
"A|¿Qué hace auditpol /get /category:*?|Consulta las políticas de auditoría configuradas|Fuerza las GPO|Bloquea cuentas|Lista los usuarios",
"H|Los tres objetivos del hardening son:|Reducir superficie de ataque, impedir accesos no autorizados y limitar configuraciones inseguras|Aumentar puertos, permisos y servicios|Actualizar, formatear y reinstalar|Solo instalar antivirus",
"H|Una vez aplicada una baseline de seguridad:|Hay que seguir revisándola y auditándola, el hardening es continuo|Ya no se vuelve a revisar|Se desinstala|Se desactiva Windows Update"
];
const EXP=["gpedit.msc es el archivo de consola del Editor de directivas de grupo local. secpol.msc abre solo la directiva de seguridad local, eventvwr.msc el Visor de eventos y regedit el Registro.", "Home no incluye el Editor de directivas de grupo local. Está en Pro, Enterprise y Education, que tienen más herramientas administrativas.", "gpupdate /force recarga y aplica las directivas al instante. gpresult solo muestra las ya aplicadas, net accounts consulta políticas de cuenta y auditpol las de auditoría.", "El parámetro /h genera un informe HTML detallado de las directivas activas (/r solo da un resumen en consola). Sirve para verificar qué se aplicó realmente.", "La Configuración del equipo afecta a toda la máquina y sus valores se guardan en HKLM (Local Machine).", "La Configuración de usuario afecta solo a quien inició sesión y se guarda en HKCU. Truco: CU = Current User.", "Longitud, complejidad, historial y edad de la contraseña están juntos en Configuración de seguridad > Directivas de cuenta > Directiva de contraseñas.", "Es un ajuste de comportamiento del inicio de sesión, y esos ajustes viven en Directivas locales > Opciones de seguridad (junto a UAC, firma de red y acceso anónimo).", "Los derechos de usuario definen qué acciones puede hacer una cuenta o grupo: iniciar sesión local, apagar el sistema, depurar o actuar como parte del sistema operativo.", "Las plantillas administrativas son interruptores que Windows convierte en cambios del registro. Con ellas se controla Red, Sistema, Defender, Windows Update y AutoRun/AutoPlay.", "Una GPO de dominio se define una vez en Active Directory y llega a muchos equipos. Una política local solo afecta a la máquina donde se configura.", "Con umbral 0 la función de bloqueo queda desactivada: nunca se bloquea, lo que deja la cuenta expuesta a fuerza bruta.", "5 es el equilibrio: un valor muy bajo bloquea por simples errores de tecleo y uno muy alto facilita la fuerza bruta (rango típico: 3 a 10).", "Con duración 0 no hay desbloqueo automático: la cuenta sigue bloqueada hasta que un administrador la desbloquee. Los valores 1 a 99,999 son minutos de espera.", "Limitar los intentos fallidos impide probar contraseñas de forma sistemática, que es justo lo que hace un ataque de fuerza bruta.", "Unlock-ADAccount es el cmdlet que desbloquea. Get-ADUser con LockedOut solo consulta el estado, no lo cambia.", "4740 es el evento de cuenta bloqueada. 4624 es un inicio de sesión correcto y 4672 un inicio con privilegios especiales.", "net accounts muestra la longitud mínima, edades máxima y mínima de contraseña y el umbral de bloqueo del sistema local.", "La presentación recomienda 12 caracteres como mínimo: a mayor longitud, mayor resistencia a la fuerza bruta.", "El historial recuerda las últimas contraseñas (mínimo 5) para que el usuario no pueda reutilizarlas.", "1 día impide cambiar la contraseña varias veces seguidas para volver a la anterior y así eludir el historial.", "Menos permisos significa menos daño si una cuenta, proceso o servicio es comprometido. Cada uno debe tener solo lo necesario, ni uno más.", "Si un malware corre con una cuenta estándar, no tiene permisos para modificar el sistema. Es mínimo privilegio aplicado.", "UAC pide confirmación o credenciales de administrador antes de permitir cambios importantes, evitando cambios silenciosos de malware.", "Una directiva de denegación bloquea de forma explícita incluso si otra directiva permite el acceso. Denegar siempre prevalece sobre permitir.", "Remote Registry permite manejar el registro de forma remota. Si la estación no lo necesita, desactivarlo reduce la superficie de ataque. Event Log y Windows Update sí son necesarios.", "Deshabilitado impide el arranque incluso manual. En Manual el servicio no inicia solo, pero puede iniciarse cuando se necesite.", "SMBv1 es una versión antigua de SMB con problemas de seguridad; se recomienda deshabilitarla cuando no es necesaria.", "Telnet transmite los datos sin cifrar, así que credenciales y comandos pueden ser interceptados en la red.", "Get-WindowsOptionalFeature con SMB1Protocol consulta si esa característica está habilitada. Los otros comandos revisan firewall, usuarios o GPO.", "Cada servicio activo es una posible puerta de entrada, así que menos servicios innecesarios significa menor superficie de ataque.", "Algunos servicios dependen de otros. Desactivar sin saber para qué sirven puede romper funciones del sistema.", "La superficie de ataque es el conjunto de puntos que un atacante podría aprovechar: servicios, puertos, protocolos y cuentas.", "regedit es el Editor del Registro. gpedit edita directivas, secpol la seguridad local y eventvwr los eventos.", "HKCU guarda la configuración del usuario actual. HKLM guarda la del equipo completo.", "Un cambio incorrecto en el registro puede dañar Windows. Con un punto de restauración o claves exportadas puedes revertirlo.", "Las GPO son centralizadas, repetibles y fáciles de documentar. Editar el registro a mano es más propenso a errores.", "WSUS (Windows Server Update Services) prueba, aprueba y distribuye actualizaciones de forma centralizada. No es antivirus ni firewall.", "WSUS, MECM y Azure Update Manager permiten probar, aprobar y desplegar parches de forma controlada. AppLocker/SRP controlan aplicaciones.", "Cada parche corrige vulnerabilidades conocidas; apagar Windows Update deja el sistema expuesto. Se actualiza de forma controlada, no se desactiva.", "Un parche puede causar incompatibilidades. Probarlo antes evita caídas del servicio en producción.", "Una vulnerabilidad sin parche con exploit público permite ransomware, ejecución remota de código y movimiento lateral por la red.", "Las reglas de entrada bloquean todo salvo lo que una regla permita explícitamente (denegar por defecto).", "Las redes públicas (cafeterías, aeropuertos) no son de confianza. El perfil Público limita las conexiones entrantes y la visibilidad del equipo.", "Es el principio default deny: se cierra todo primero y se abre solo lo necesario, minimizando la exposición.", "Protege archivos y carpetas importantes de modificaciones no autorizadas, que es lo que hace el ransomware al cifrarlos.", "Microsoft Security Compliance Toolkit ofrece baselines de seguridad e incluye Policy Analyzer y LGPO.", "AppLocker crea reglas por editor, ruta o hash para permitir o bloquear ejecutables, scripts e instaladores (lista blanca).", "Get-NetFirewallProfile muestra si cada perfil del firewall (dominio, privado, público) está activo.", "Los eventos de seguridad y auditoría, como los inicios de sesión, se guardan en el registro Seguridad, no en Aplicación.", "auditpol /get /category:* solo consulta qué categorías de auditoría están configuradas; no las modifica.", "Los 3 objetivos son: reducir la superficie de ataque, impedir accesos no autorizados y limitar configuraciones inseguras. No confundir con los 5 pilares.", "El hardening es un proceso continuo: hay que revisar, auditar y verificar. Una baseline aplicada no significa trabajo terminado."];
const BANK=RAW.map((r,k)=>{const p=r.split("|");return{t:TOPICS[p[0]],q:p[1],a:p[2],o:p.slice(2),e:EXP[k]}});
const $=s=>document.querySelector(s),app=$("#app");
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
let cfg={n:53,topic:"all"},pool=[],i=0,res=[];

function home(){
app.innerHTML=`<label>Cantidad de preguntas</label><div class="row" id="ns">${[10,25,53].map(n=>`<button class="chip ${cfg.n==n?"on":""}" data-n="${n}">${n}</button>`).join("")}</div>
<label>Tema</label><select id="tp"><option value="all">Todos los temas (${BANK.length})</option>${Object.values(TOPICS).map(t=>`<option ${cfg.topic==t?"selected":""}>${t}</option>`).join("")}</select>
<button class="go" id="st">INICIAR REPASO ▶</button>`;
$("#ns").onclick=e=>{if(e.target.dataset.n){cfg.n=+e.target.dataset.n;home()}};
$("#tp").onchange=e=>cfg.topic=e.target.value;
$("#st").onclick=()=>start(BANK.filter(x=>cfg.topic=="all"||x.t==cfg.topic).slice().sort(()=>Math.random()-.5).slice(0,cfg.n));
}
function start(list){pool=list.map(x=>({...x,o:shuf(x.o)}));i=0;res=[];show()}
function show(){
const x=pool[i],L="ABCD";
app.innerHTML=`<div class="top"><span>Pregunta ${i+1}/${pool.length}</span><span>✔ ${res.filter(r=>r.ok).length} · ✖ ${res.filter(r=>!r.ok).length}</span></div>
<div class="bar"><i style="width:${i/pool.length*100}%"></i></div><span class="tag">${x.t}</span><p class="q">${x.q}</p>
${x.o.map((o,k)=>`<button class="opt" data-o="${k}"><b>${L[k]}</b>${o}</button>`).join("")}<div id="nx"></div>`;
app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
const ch=x.o[b.dataset.o],ok=ch==x.a;res.push({...x,ch,ok});
app.querySelectorAll(".opt").forEach((e,k)=>{e.disabled=true;e.style.cursor="default";if(x.o[k]==x.a)e.classList.add("ok");else if(e==b)e.classList.add("no")});
$("#nx").innerHTML=`<div class="ex ${ok?"y":"n"}"><b>${ok?"✔ ¡Correcto!":"✖ Incorrecto. La respuesta correcta es: "+x.a}</b><br>${x.e}</div><button class="nx">${i+1<pool.length?"Siguiente ▶":"Ver resultados ▶"}</button>`;
$(".nx").onclick=()=>{i++;i<pool.length?show():end()}});
}
function end(){
const ok=res.filter(r=>r.ok).length,n=res.length,p=Math.round(ok/n*100),bad=res.filter(r=>!r.ok);
const col=p>=80?"var(--ok)":p>=60?"#fbbf24":"var(--bad)";
const msg=p>=90?"Excelente, estás listo para el examen.":p>=70?"Buen nivel. Repasa los temas en rojo.":p>=50?"Vas a medio camino. Refuerza los temas débiles.":"Necesitas más repaso. Empieza por los fallos.";
const tp={};res.forEach(r=>{(tp[r.t]??={ok:0,n:0});tp[r.t].n++;if(r.ok)tp[r.t].ok++});
const ord=Object.entries(tp).sort((a,b)=>a[1].ok/a[1].n-b[1].ok/b[1].n);
app.innerHTML=`<div class="ring" style="background:conic-gradient(${col} ${p}%,var(--line) 0)"><div style="color:${col}">${p}%</div></div>
<p style="text-align:center;color:var(--m)">${msg}</p>
<div class="stats"><div><b style="color:var(--ok)">${ok}</b>Correctas</div><div><b style="color:var(--bad)">${n-ok}</b>Falladas</div><div><b>${n}</b>Total</div></div>
<h3>// Rendimiento por tema</h3>${ord.map(([t,v])=>{const q=Math.round(v.ok/v.n*100);return`<div class="tp">${t} — ${v.ok}/${v.n} (${q}%)<div class="bar"><i style="width:${q}%;background:${q>=70?"var(--ok)":q>=50?"#fbbf24":"var(--bad)"}"></i></div></div>`}).join("")}
${ord[0]&&ord[0][1].ok<ord[0][1].n?`<p style="color:var(--m);font-size:.85rem">⚠ Tema a reforzar: <span style="color:var(--c)">${ord[0][0]}</span></p>`:""}
<h3>// Preguntas falladas (${bad.length})</h3>
${bad.length?bad.map(r=>`<div class="fail">${r.q}<br><s>Tu respuesta: ${r.ch}</s><br><em>Correcta: ${r.a}</em></div>`).join(""):"<p>¡Sin errores! 🎯</p>"}
<div class="row" style="margin-top:18px">${bad.length?`<button class="chip on" id="rf">Repasar falladas</button>`:""}<button id="rs">Nuevo intento</button><button id="hm">Menú</button></div>`;
if(bad.length)$("#rf").onclick=()=>start(bad.map(({t,q,a,o,e})=>({t,q,a,o,e})));
$("#rs").onclick=()=>start(BANK.filter(x=>cfg.topic=="all"||x.t==cfg.topic).slice().sort(()=>Math.random()-.5).slice(0,cfg.n));
$("#hm").onclick=home;
}
home();
</script>
</body>
</html>
